<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products - KarakoramStore</title>
  <meta name="description" content="Shop authentic Gilgiti caps and Himalayan shilajit. Cash on Delivery across Pakistan.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="all-products" id="top">

  <div id="site-header-host"></div>

  <div class="shop-breadcrumb max-wrap">
    <a href="index.html">Home</a>
    <span aria-hidden="true">/</span>
    <span>All Products</span>
  </div>

  <div class="shop-page max-wrap">
    <aside class="shop-sidebar" id="shop-sidebar">
      <button type="button" class="shop-sidebar-close" id="shop-sidebar-close" aria-label="Close filters">&times;</button>
      <h2 class="shop-sidebar-title">Categories</h2>
      <ul class="shop-cat-list" id="shop-cat-list"></ul>
      <hr class="shop-sidebar-hr">
      <h3 class="shop-sidebar-sub">Payment</h3>
      <ul class="shop-filter-list">
        <li><span class="shop-filter-dot"></span> Cash on Delivery</li>
        <li><span class="shop-filter-dot"></span> Easypaisa / JazzCash</li>
      </ul>
      <hr class="shop-sidebar-hr">
      <p class="shop-sidebar-note">Authentic products from Gilgit-Baltistan. Every order confirmed by call or WhatsApp.</p>
    </aside>

    <div class="shop-main">
      <header class="shop-toolbar">
        <div class="shop-toolbar-left">
          <button type="button" class="btn outline shop-filter-btn" id="shop-filter-open">Filter</button>
          <p class="shop-results" id="shop-results-count"></p>
        </div>
        <div class="shop-toolbar-right">
          <label class="shop-sort-label" for="shop-sort">Sort by</label>
          <select id="shop-sort" class="shop-sort-select">
            <option value="featured">Featured</option>
            <option value="name-asc">Alphabetically, A–Z</option>
            <option value="price-asc">Price, low to high</option>
            <option value="price-desc">Price, high to low</option>
          </select>
        </div>
      </header>

      <form id="searchForm" class="shop-search" role="search">
        <input id="searchInput" type="search" placeholder="Search Gilgiti cap, shilajit…" aria-label="Search products">
        <button type="submit" class="btn">Search</button>
      </form>

      <h1 class="shop-page-title">All Products</h1>
      <p class="shop-page-lead">Handmade Gilgiti caps &amp; pure Himalayan shilajit — <strong>Cash on Delivery</strong> nationwide.</p>

      <div class="shop-grid" id="shop-products-grid"></div>
    </div>
  </div>

  <div id="shop-sidebar-backdrop" class="shop-sidebar-backdrop" hidden></div>

  <div id="site-footer-host"></div>

  <script src="js/site.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
