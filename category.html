<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category - KarakoramStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="store-theme" data-page="category" id="top">

  <div id="site-header-host"></div>

  <div class="shop-breadcrumb store-container">
    <a href="index.html">Home</a>
    <span aria-hidden="true">/</span>
    <a href="all-products.html">All Products</a>
    <span aria-hidden="true">/</span>
    <span id="breadcrumb-cat">Category</span>
  </div>

  <div class="shop-page store-container">
    <aside class="shop-sidebar" id="shop-sidebar">
      <button type="button" class="shop-sidebar-close" id="shop-sidebar-close" aria-label="Close filters">&times;</button>
      <h2 class="shop-sidebar-title">Categories</h2>
      <ul class="shop-cat-list" id="shop-cat-list"></ul>
      <div class="shop-refine-block">
        <div class="shop-refine-head">
          <h2 class="shop-sidebar-title">Refined by</h2>
          <button type="button" class="shop-clear-btn" id="shop-clear-filters">Clear all</button>
        </div>
        <p class="shop-refine-count" id="shop-results-sidebar"></p>
      </div>
      <h3 class="shop-filter-heading">Availability</h3>
      <ul class="shop-check-list">
        <li>
          <label class="shop-check-label">
            <input type="checkbox" id="filter-in-stock" checked>
            <span>In stock</span>
            <span class="shop-check-count" id="count-in-stock"></span>
          </label>
        </li>
      </ul>
      <h3 class="shop-filter-heading">Price</h3>
      <div class="shop-price-filter">
        <div class="shop-range-wrap">
          <input type="range" id="price-range-min" class="shop-range" min="0" max="6000" value="0">
          <input type="range" id="price-range-max" class="shop-range" min="0" max="6000" value="6000">
        </div>
        <div class="shop-price-inputs">
          <span class="shop-price-currency">PKR</span>
          <input type="number" id="price-input-min" min="0" max="6000" value="0">
          <span class="shop-price-to">to</span>
          <span class="shop-price-currency">PKR</span>
          <input type="number" id="price-input-max" min="0" max="6000" value="6000">
        </div>
      </div>
    </aside>

    <div class="shop-main">
      <h1 class="shop-page-title" id="cat-title">Category</h1>
      <p class="shop-page-lead" id="cat-description"></p>
      <div class="shop-toolbar-bar">
        <div class="shop-toolbar-bar-left">
          <button type="button" class="shop-filter-btn" id="shop-filter-open">Filter</button>
          <p class="shop-results" id="shop-results-count"></p>
        </div>
        <div class="shop-toolbar-bar-right">
          <div class="shop-view-as">
            <span class="shop-tool-label">View as</span>
            <button type="button" class="shop-view-btn" data-cols="2">2</button>
            <button type="button" class="shop-view-btn" data-cols="3">3</button>
            <button type="button" class="shop-view-btn is-active" data-cols="4">4</button>
          </div>
          <label class="shop-tool-label" for="shop-per-page">Items per page</label>
          <select id="shop-per-page" class="shop-tool-select">
            <option value="12">12</option>
            <option value="20" selected>20</option>
          </select>
          <label class="shop-tool-label" for="shop-sort">Sort by</label>
          <select id="shop-sort" class="shop-tool-select">
            <option value="featured">Featured</option>
            <option value="name-asc">Alphabetically, A–Z</option>
            <option value="price-asc">Price, low to high</option>
            <option value="price-desc">Price, high to low</option>
          </select>
        </div>
      </div>
      <div class="shop-grid cols-4" id="shop-products-grid"></div>
    </div>
  </div>

  <div id="shop-sidebar-backdrop" class="shop-sidebar-backdrop" hidden></div>
  <div id="site-footer-host"></div>

  <script src="js/site.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
