<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category - KarakoramStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="category" id="top">

  <div id="site-header-host"></div>

  <div class="shop-breadcrumb max-wrap">
    <a href="index.html">Home</a>
    <span aria-hidden="true">/</span>
    <a href="all-products.html">All Products</a>
    <span aria-hidden="true">/</span>
    <span id="breadcrumb-cat">Category</span>
  </div>

  <div class="shop-page max-wrap">
    <aside class="shop-sidebar" id="shop-sidebar">
      <button type="button" class="shop-sidebar-close" id="shop-sidebar-close" aria-label="Close filters">&times;</button>
      <h2 class="shop-sidebar-title">Categories</h2>
      <ul class="shop-cat-list" id="shop-cat-list"></ul>
      <hr class="shop-sidebar-hr">
      <p class="shop-sidebar-note">Cash on Delivery across Pakistan.</p>
    </aside>

    <div class="shop-main">
      <header class="shop-toolbar">
        <div class="shop-toolbar-left">
          <button type="button" class="btn outline shop-filter-btn" id="shop-filter-open">Filter</button>
          <p class="shop-results" id="shop-results-count"></p>
        </div>
        <div class="shop-toolbar-right">
          <label class="shop-sort-label" for="shop-sort">Sort by</label>
          <select id="shop-sort" class="shop-sort-select">
            <option value="featured">Featured</option>
            <option value="name-asc">Alphabetically, A–Z</option>
            <option value="price-asc">Price, low to high</option>
            <option value="price-desc">Price, high to low</option>
          </select>
        </div>
      </header>

      <h1 class="shop-page-title" id="cat-title">Category</h1>
      <p class="shop-page-lead" id="cat-description"></p>

      <div class="shop-grid" id="shop-products-grid"></div>
    </div>
  </div>

  <div id="shop-sidebar-backdrop" class="shop-sidebar-backdrop" hidden></div>

  <div id="site-footer-host"></div>

  <script src="js/site.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
