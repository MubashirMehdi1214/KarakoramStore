<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products - KarakoramStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="all-books" id="top">

  <div id="site-header-host"></div>

  <section class="section">
    <div class="section-title"><h2>All Products<span id="current-query"></span></h2></div>

    <form id="searchForm" class="search-box" role="search" style="max-width:520px;margin:0 auto 36px;background:#fff;border-radius:100px;padding:6px;display:flex;align-items:center;box-shadow:var(--shadow);">
      <input id="searchInput" type="search" placeholder="Search products..." aria-label="Search" style="flex:1;border:0;outline:0;background:transparent;padding:12px 18px;font-family:inherit;font-size:15px;">
      <button type="submit" style="background:var(--accent);color:#fff;border:0;border-radius:100px;padding:12px 26px;font-family:inherit;font-weight:700;cursor:pointer;">Search</button>
    </form>

    <div class="book-grid" id="all-books-grid"></div>
  </section>

  <div id="site-footer-host"></div>

  <script src="js/books.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
